{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mesa Abierta{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
    <nav class="site-nav navbar navbar-dark no-print">
        <div class="container py-2">
            <a class="navbar-brand brand-mark fw-bold" href="{% url 'frontend:lista-recetas' %}">MESA ABIERTA</a>
            <span class="text-white-50 small">Recetas para cocinar sin prisa</span>
        </div>
    </nav>
    {% block content %}{% endblock %}
    <footer class="container py-5 text-center no-print">Una colección de recetas publicadas.</footer>
</body>
</html>
