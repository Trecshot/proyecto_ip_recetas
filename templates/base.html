{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mesa Abierta{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ink: #17231f;
            --muted: #65736d;
            --cream: #f7f3eb;
            --sage: #dce8dd;
            --coral: #d9674d;
            --line: #d9e0d9;
        }
        body {
            color: var(--ink);
            background: var(--cream);
            font-family: Georgia, 'Times New Roman', serif;
        }
        .site-nav { background: var(--ink); }
        .brand-mark { color: #f4c873; letter-spacing: .08em; }
        .hero { background: var(--sage); border-bottom: 1px solid var(--line); }
        .eyebrow { color: var(--coral); font: 700 .75rem/1.2 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
        .recipe-card { border: 1px solid var(--line); border-radius: 6px; background: #fffdf8; transition: transform .2s ease, box-shadow .2s ease; }
        .recipe-card:hover { transform: translateY(-4px); box-shadow: 0 1rem 2rem rgba(23, 35, 31, .09); }
        .recipe-card .card-title { color: var(--ink); }
        .meta { color: var(--muted); font: .86rem/1.4 Arial, sans-serif; }
        .tag { color: var(--ink); background: var(--sage); font: 700 .72rem/1 Arial, sans-serif; }
        .btn-coral { color: #fff; background: var(--coral); border-color: var(--coral); }
        .btn-coral:hover { color: #fff; background: #b9533d; border-color: #b9533d; }
        .ingredient-list { font-family: Arial, sans-serif; }
        footer { color: var(--muted); font: .8rem Arial, sans-serif; }
    </style>
</head>
<body>
    <nav class="site-nav navbar navbar-dark">
        <div class="container py-2">
            <a class="navbar-brand brand-mark fw-bold" href="{% url 'frontend:lista-recetas' %}">MESA ABIERTA</a>
            <span class="text-white-50 small">Recetas para cocinar sin prisa</span>
        </div>
    </nav>
    {% block content %}{% endblock %}
    <footer class="container py-5 text-center">Una colección de recetas publicadas.</footer>
</body>
</html>
